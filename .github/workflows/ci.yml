name: testes

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Versão igual em version.go, winres.json e CHANGELOG
        run: sh scripts/check-version.sh
      - name: Ferramentas do AppImage (versão fixa, SHA-256 conferido)
        # as mesmas que o job de release usa: se a soma não bater, falha aqui
        # no PR, não na hora de publicar
        run: sh build/linux/build-appimage.sh --so-ferramentas
      - name: Dependências do Linux (GTK/WebKit)
        # no pior caso (4 tentativas travadas) falha em ~25 min, não em horas
        timeout-minutes: 25
        run: |
          # o espelho do apt às vezes trava: tenta 4 vezes com tempo curto e,
          # a partir da 3ª, troca o espelho da Azure pelo oficial (o runner lista
          # o espelho em apt-mirrors.txt, não só no sources)
          for i in 1 2 3 4; do
            if [ "$i" -eq 3 ]; then
              sudo sed -i 's#http://azure.archive.ubuntu.com#http://archive.ubuntu.com#g' /etc/apt/apt-mirrors.txt /etc/apt/sources.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
            fi
            if [ "$i" -eq 4 ]; then
              # a porta 80 do Ubuntu também pode estar fora: espelho em https
              sudo sed -i 's#http://archive.ubuntu.com#https://mirrors.edge.kernel.org#g' /etc/apt/apt-mirrors.txt /etc/apt/sources.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
            fi
            sudo timeout 150 apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 update \
              && sudo timeout 300 apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 install -y libgtk-3-dev libwebkit2gtk-4.1-dev \
              && exit 0
            echo "apt: tentativa $i falhou"; sleep 10
          done
          exit 1
      - name: Dependências travadas (go.sum)
        # o go.sum fica no repositório: confere as somas do que foi baixado e
        # falha se go.mod/go.sum precisarem de "go mod tidy"
        run: |
          go mod download
          go mod verify
          go mod tidy -diff
      - name: Testes
        run: go test -tags webkit2_41 ./...
      - name: Testes com detector de corrida
        run: go test -race -tags webkit2_41 ./internal/...
      - name: Compila (Windows e Linux)
        run: |
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -tags desktop,production -o /dev/null .
          CGO_ENABLED=1 go build -tags desktop,production,webkit2_41 -o /dev/null .
