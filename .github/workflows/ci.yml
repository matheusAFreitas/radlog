name: testes

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Dependências do Linux (GTK/WebKit)
        # o espelho do apt às vezes trava: falha em 10 min em vez de esperar horas
        timeout-minutes: 10
        run: sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update && sudo apt-get -o Acquire::Retries=3 install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: go.sum
        run: go mod tidy
      - name: Testes
        run: go test -tags webkit2_41 ./...
      - name: Compila (Windows e Linux)
        run: |
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -tags desktop,production -o /dev/null .
          CGO_ENABLED=1 go build -tags desktop,production,webkit2_41 -o /dev/null .
