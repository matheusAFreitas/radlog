name: testes

on:
  push:
    branches: [main]
  pull_request:

# só leitura: o CI não publica nada
permissions:
  contents: read

# ações de terceiros presas pelo commit (uma etiqueta pode ser movida);
# o comentário diz a versão de cada uma
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.27"
      - name: Dependências do Linux (GTK/WebKit)
        # no pior caso (4 tentativas travadas) falha em ~25 min, não em horas
        timeout-minutes: 25
        uses: ./.github/actions/linux-deps
      - name: Dependências travadas (go.sum)
        # o go.sum fica no repositório: confere as somas do que foi baixado e
        # falha se go.mod/go.sum precisarem de "go mod tidy"
        run: |
          go mod download
          go mod verify
          go mod tidy -diff
      - name: Testes
        run: go test -tags webkit2_41 ./...
      - name: Testes com detector de corrida
        run: go test -race -tags webkit2_41 ./internal/...
      - name: Compila (Windows e Linux)
        run: |
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -tags desktop,production -o /dev/null .
          CGO_ENABLED=1 go build -tags desktop,production,webkit2_41 -o /dev/null .
      - name: staticcheck (Linux e Windows)
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.2
          staticcheck -tags webkit2_41 ./...
          GOOS=windows staticcheck -tags desktop,production ./...
      - name: govulncheck (falhas conhecidas no Go e nas dependências)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck -tags webkit2_41 ./...
      - name: Toda frase nova com tradução (en.tsv)
        run: python3 scripts/i18n_check.py
      - name: Telas (11 páginas, 2 larguras, 2 idiomas, sem erro de script)
        run: |
          npm install --no-save --no-audit --no-fund --prefix /tmp/pw playwright-core@1.63.0
          NODE_PATH=/tmp/pw/node_modules RADLOG_CHROME=chrome node scripts/telas_test.js

  windows:
    # o Bluetooth, a bandeja e a troca de versão do Windows só rodam aqui
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.27"
      - name: Testes no Windows
        run: go test ./internal/...
