name: testes

on:
  push:
    branches: [main]
  pull_request:

# só leitura: o CI não publica nada
permissions:
  contents: read

# ações de terceiros presas pelo commit (uma etiqueta pode ser movida);
# o comentário diz a versão de cada uma
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.27"
      - name: Versão igual em version.go, winres.json e CHANGELOG
        run: sh scripts/check-version.sh
      - name: Ferramentas do AppImage (versão fixa, SHA-256 conferido)
        # as mesmas que o job de release usa: se a soma não bater, falha aqui
        # no PR, não na hora de publicar
        run: sh build/linux/build-appimage.sh --so-ferramentas
      - name: Dependências do Linux (GTK/WebKit)
        # no pior caso (4 tentativas travadas) falha em ~25 min, não em horas
        timeout-minutes: 25
        uses: ./.github/actions/linux-deps
      - name: Dependências travadas (go.sum)
        # o go.sum fica no repositório: confere as somas do que foi baixado e
        # falha se go.mod/go.sum precisarem de "go mod tidy"
        run: |
          go mod download
          go mod verify
          go mod tidy -diff
      - name: Testes
        run: go test -tags webkit2_41 ./...
      - name: Testes com detector de corrida
        run: go test -race -tags webkit2_41 ./internal/...
      - name: Compila (Windows e Linux)
        run: |
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -tags desktop,production -o /dev/null .
          CGO_ENABLED=1 go build -tags desktop,production,webkit2_41 -o /dev/null .
      - name: staticcheck (Linux e Windows)
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.2
          staticcheck -tags webkit2_41 ./...
          GOOS=windows staticcheck -tags desktop,production ./...
      - name: govulncheck (falhas conhecidas no Go e nas dependências)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck -tags webkit2_41 ./...
      - name: Avisos de licença das bibliotecas em dia (frontend/dist/licencas.txt)
        run: go run ./scripts/licenses -check
      - name: Toda frase nova com tradução (en.tsv)
        run: python3 scripts/i18n_check.py
      - name: Telas (11 páginas, 2 larguras, 2 idiomas, sem erro de script)
        run: |
          npm install --no-save --no-audit --no-fund --prefix /tmp/pw playwright-core@1.63.0
          NODE_PATH=/tmp/pw/node_modules RADLOG_CHROME=chrome node scripts/telas_test.js
      - name: Tela da nuvem de ponta a ponta (página + App + Drive de mentira)
        run: RADLOG_E2E=1 NODE_PATH=/tmp/pw/node_modules RADLOG_CHROME=chrome go test -count=1 -tags webkit2_41 -run 'TestCloudScreenE2E|TestDemoScreenE2E' ./internal/app/

  windows:
    # o Bluetooth, a bandeja e a troca de versão do Windows só rodam aqui
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.27"
      - name: Testes no Windows
        run: go test ./internal/...

  android:
    # o app de Android (3.0.0): o motor em Go vira uma .aar pelo gomobile e o
    # Gradle monta o APK. Sem o keystore do RadLog nos segredos, sai com a
    # chave de debug (só para teste).
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      # gomobile preso pela versão do módulo (golang.org/x/mobile não tem etiquetas)
      GOMOBILE: v0.0.0-20261011034528-197770444867
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.27"
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Motor compila para o Android
        run: |
          CGO_ENABLED=0 GOOS=android GOARCH=arm64 go vet ./internal/... ./mobile
          go test -race ./mobile
      - name: gomobile (motor em .aar)
        env:
          # a mesma chave do Google do PC (login da nuvem); não chega a PR de fork
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          go install golang.org/x/mobile/cmd/gomobile@$GOMOBILE
          go install golang.org/x/mobile/cmd/gobind@$GOMOBILE
          # só no CI: o go.mod do repositório não leva o gomobile
          go get golang.org/x/mobile/bind@$GOMOBILE
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          gomobile init
          mkdir -p android/app/libs
          gomobile bind -target=android/arm64 -androidapi 29 -javapkg=app.radlog.go \
            -ldflags "-s -w -X radlog/internal/app.googleClientID=$GOOGLE_CLIENT_ID -X radlog/internal/app.googleClientSecret=$GOOGLE_CLIENT_SECRET" \
            -o android/app/libs/radlog.aar ./mobile
      - name: APK
        working-directory: android
        env:
          # a chave de verdade só no main (nunca em PR)
          KEYSTORE: ${{ github.event_name == 'push' && secrets.RADLOG_ANDROID_KEYSTORE || '' }}
          KS_PASS: ${{ secrets.RADLOG_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RADLOG_ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.RADLOG_ANDROID_KEY_PASSWORD }}
        run: |
          SIGN=""
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/radlog.jks"
            SIGN="-Pradlog.storeFile=$RUNNER_TEMP/radlog.jks -Pradlog.storePassword=$KS_PASS -Pradlog.keyAlias=$KEY_ALIAS -Pradlog.keyPassword=$KEY_PASS"
          fi
          ./gradlew --no-daemon assembleRelease \
            -PradlogVersion=3.0.0-dev.${{ github.run_number }} -PradlogCode=${{ github.run_number }} $SIGN
          rm -f "$RUNNER_TEMP/radlog.jks"
          mv app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/RadLog-android-dev.${{ github.run_number }}.apk"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: RadLog-android
          path: ${{ runner.temp }}/RadLog-android-*.apk
          retention-days: 14
