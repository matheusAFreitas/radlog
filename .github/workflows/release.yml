name: release

# Gera o .exe (Windows), o AppImage e o .tar.gz (Linux) e publica a release
# com o trecho daquela versão no CHANGELOG. Dispara sozinho:
#   - quando um push no main muda internal/app/version.go e a versão ainda
#     não tem release (cria a tag vX.Y.Z);
#   - Actions → release → Run workflow (a mesma coisa, à mão);
#   - empurrar uma tag "vX.Y.Z" (precisa bater com o version.go).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [internal/app/version.go]
    tags: ["v*"]

permissions:
  contents: write

# uma release por vez, na ordem dos pushes: duas seguidas (ex.: 2.20.5 e
# 2.21.0) corriam juntas e a mais velha terminava por último, virando a
# "latest" que o atualizador do app consulta
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      ver: ${{ steps.v.outputs.ver }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Versão
        id: v
        run: |
          V=$(sed -n 's/^const AppVersion = "\(.*\)"/\1/p' internal/app/version.go)
          echo "ver=$V" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            if [ "v$V" != "${GITHUB_REF_NAME}" ]; then echo "a tag ${GITHUB_REF_NAME} não bate com internal/app/version.go ($V)"; exit 1; fi
          elif git ls-remote --exit-code --tags origin "refs/tags/v$V" >/dev/null; then
            echo "a versão $V já tem release (tag v$V): nada a publicar."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"

  build:
    needs: check
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.27"
      - name: Dependências do Linux (GTK/WebKit)
        # no pior caso (4 tentativas travadas) falha em ~25 min, não em horas
        timeout-minutes: 25
        uses: ./.github/actions/linux-deps
      - name: Versão
        id: v
        run: echo "ver=${{ needs.check.outputs.ver }}" >> "$GITHUB_OUTPUT"
      - name: Dependências travadas (go.sum)
        # o go.sum fica no repositório: confere as somas do que foi baixado e
        # falha se go.mod/go.sum precisarem de "go mod tidy"
        run: |
          go mod download
          go mod verify
          go mod tidy -diff
      - name: Testes
        run: go test -tags webkit2_41 ./...
      - name: Chave do app no Google (nuvem)
        # sem os segredos a versão sairia com a nuvem desligada sem ninguém
        # notar (auditoria 2.79.0, S2): falha antes de compilar
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          if [ -z "$GOOGLE_CLIENT_ID" ] || [ -z "$GOOGLE_CLIENT_SECRET" ]; then
            echo "::error::faltam os segredos GOOGLE_CLIENT_ID e GOOGLE_CLIENT_SECRET"
            exit 1
          fi
      - name: Windows (.exe)
        # a chave do app no Google (nuvem) entra só no build, pelos segredos
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          G="-X radlog/internal/app.googleClientID=$GOOGLE_CLIENT_ID -X radlog/internal/app.googleClientSecret=$GOOGLE_CLIENT_SECRET"
          go install github.com/tc-hib/go-winres@v0.3.3
          go-winres make --in build/windows/winres.json
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -tags desktop,production \
            -ldflags "-w -s -H windowsgui $G" -o "out/RadLog-v${{ steps.v.outputs.ver }}.exe" .
      - name: Linux (AppImage e .tar.gz)
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          G="-X radlog/internal/app.googleClientID=$GOOGLE_CLIENT_ID -X radlog/internal/app.googleClientSecret=$GOOGLE_CLIENT_SECRET"
          V=${{ steps.v.outputs.ver }}
          P="out/radlog-v$V-linux-x86_64"
          mkdir -p "$P"
          CGO_ENABLED=1 go build -trimpath -tags desktop,production,webkit2_41 -ldflags "-w -s $G" -o "$P/radlog" .
          cp build/linux/* "$P/"
          echo "$V" > "$P/VERSION"
          (cd "$P" && sh build-appimage.sh)
          mv "$P/RadLog-v$V-x86_64.AppImage" out/
          rm -rf "$P/RadLog.AppDir" "$P/appimagetool" "$P/appimage-runtime"
          tar -C out -czf "out/radlog-v$V-linux-x86_64.tar.gz" "radlog-v$V-linux-x86_64"
      - name: SHA-256 dos arquivos (o atualizador do app confere)
        run: |
          cd out
          sha256sum *.exe *.AppImage *.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Assinatura do SHA256SUMS.txt (o app 2.16+ só instala se conferir)
        env:
          RADLOG_SIGN_KEY: ${{ secrets.RADLOG_SIGN_KEY }}
        run: |
          # sem o segredo, ou com uma chave que não é a do app, o passo falha
          # e nada é publicado (os apps 2.16+ recusariam a versão)
          go run ./scripts/sign sign out/SHA256SUMS.txt
          go run ./scripts/sign verify out/SHA256SUMS.txt
      - name: Notas da versão (do CHANGELOG)
        run: |
          awk -v v="## ${{ steps.v.outputs.ver }}" '$0==v{f=1;next} /^## /{if(f)exit} f' CHANGELOG.md > notes.md
          printf '\n---\n**Downloads:** Windows: `RadLog-v%s.exe` · Linux: `RadLog-v%s-x86_64.AppImage` (precisa da WebKitGTK 4.1) ou `radlog-v%s-linux-x86_64.tar.gz` (com `install.sh`).\n' \
            "${{ steps.v.outputs.ver }}" "${{ steps.v.outputs.ver }}" "${{ steps.v.outputs.ver }}" >> notes.md
          cat notes.md
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          name: v${{ steps.v.outputs.ver }}
          tag_name: v${{ steps.v.outputs.ver }}
          target_commitish: ${{ github.sha }}
          body_path: notes.md
          make_latest: true
          files: |
            out/*.exe
            out/*.AppImage
            out/*.tar.gz
            out/SHA256SUMS.txt
            out/SHA256SUMS.txt.sig

  # cria a linha da versão no banco "Versões" do Notion. Precisa do segredo
  # NOTION_TOKEN (integração interna do Notion com acesso ao banco); sem ele o
  # passo só avisa e sai. Falha aqui não desfaz a release, que já saiu.
  notion:
    needs: [check, build]
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - name: Linha no banco de Versões
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DB: ${{ vars.NOTION_VERSOES_DB || 'a1d7164289e14b10a71ad9e193dbddf8' }}
          VER: ${{ needs.check.outputs.ver }}
          MSG: ${{ github.event.head_commit.message }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "$NOTION_TOKEN" ]; then echo "sem NOTION_TOKEN: nada a fazer"; exit 0; fi
          H='Notion-Version: 2022-06-28'
          # já existe? (rodar a release de novo não duplica a linha)
          n=$(jq -n --arg v "$VER" '{filter:{property:"Versão",title:{equals:$v}}}' \
            | curl -sfS -X POST "https://api.notion.com/v1/databases/$NOTION_DB/query" \
                -H "Authorization: Bearer $NOTION_TOKEN" -H "$H" -H 'Content-Type: application/json' -d @- \
            | jq '.results | length')
          if [ "$n" != "0" ]; then echo "a $VER já está no Notion"; exit 0; fi
          # título do commit: "Resumo (X.Y.Z) (#N)"
          T=$(printf '%s\n' "$MSG" | head -n1)
          PR=$(printf '%s' "$T" | sed -n 's/.*(#\([0-9]\+\))$/\1/p')
          RES=$(printf '%s' "$T" | sed -e 's/ *(#[0-9]\+)$//' -e "s/ *($VER)$//")
          IFS=. read -r MA MI PA <<< "$VER"
          if [ "$MA" = 2 ]; then FX="2.$((MI / 10))x"; else FX="$MA.x"; fi
          if [ "$PA" != 0 ]; then TP=Patch; elif [ "$MI" = 0 ]; then TP=Major; else TP=Minor; fi
          URL=""; [ -n "$PR" ] && URL="https://github.com/$REPO/pull/$PR"
          jq -n --arg db "$NOTION_DB" --arg v "$VER" --arg r "$RES" --arg fx "$FX" --arg tp "$TP" \
                --arg url "$URL" --arg d "$(date -u +%Y-%m-%dT%H:%M:%SZ)" '{
              parent: {database_id: $db},
              properties: ({
                "Versão": {title: [{text: {content: $v}}]},
                "Resumo": {rich_text: [{text: {content: $r}}]},
                "Faixa": {select: {name: $fx}},
                "Tipo": {select: {name: $tp}},
                "Data": {date: {start: $d}}
              } + (if $url == "" then {} else {"PR": {url: $url}} end))
            }' \
            | curl -sfS -X POST https://api.notion.com/v1/pages \
                -H "Authorization: Bearer $NOTION_TOKEN" -H "$H" -H 'Content-Type: application/json' -d @- \
            | jq -r '"criada: " + .url'
