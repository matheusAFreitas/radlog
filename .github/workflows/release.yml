name: release

# Gera o .exe (Windows), o AppImage e o .tar.gz (Linux) e publica a release
# com o trecho daquela versão no CHANGELOG. Dois jeitos de disparar:
#   - Actions → release → Run workflow: publica a versão que está em
#     internal/app/version.go no main (cria a tag vX.Y.Z sozinho);
#   - empurrar uma tag "vX.Y.Z" (precisa bater com o version.go).
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Dependências do Linux (GTK/WebKit)
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Versão
        id: v
        run: |
          V=$(sed -n 's/^const AppVersion = "\(.*\)"/\1/p' internal/app/version.go)
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            if [ "v$V" != "${GITHUB_REF_NAME}" ]; then echo "a tag ${GITHUB_REF_NAME} não bate com internal/app/version.go ($V)"; exit 1; fi
          elif git ls-remote --exit-code --tags origin "refs/tags/v$V" >/dev/null; then
            echo "a versão $V já tem release (tag v$V). Mude internal/app/version.go antes."; exit 1
          fi
          echo "ver=$V" >> "$GITHUB_OUTPUT"
      - name: go.sum
        run: go mod tidy
      - name: Testes
        run: go test -tags webkit2_41 ./...
      - name: Windows (.exe)
        run: |
          go install github.com/tc-hib/go-winres@latest
          go-winres make --in build/windows/winres.json
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -tags desktop,production \
            -ldflags "-w -s -H windowsgui" -o "out/GMC-Monitor-v${{ steps.v.outputs.ver }}.exe" .
      - name: Linux (AppImage e .tar.gz)
        run: |
          V=${{ steps.v.outputs.ver }}
          P="out/gmc-monitor-v$V-linux-x86_64"
          mkdir -p "$P"
          CGO_ENABLED=1 go build -trimpath -tags desktop,production,webkit2_41 -ldflags "-w -s" -o "$P/gmc-monitor" .
          cp build/linux/* "$P/"
          echo "$V" > "$P/VERSION"
          (cd "$P" && sh build-appimage.sh)
          mv "$P/GMC-Monitor-v$V-x86_64.AppImage" out/
          rm -rf "$P/GMC-Monitor.AppDir" "$P/appimagetool"
          tar -C out -czf "out/gmc-monitor-v$V-linux-x86_64.tar.gz" "gmc-monitor-v$V-linux-x86_64"
      - name: SHA-256 dos arquivos (o atualizador do app confere)
        run: |
          cd out
          sha256sum *.exe *.AppImage *.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Notas da versão (do CHANGELOG)
        run: |
          awk -v v="## ${{ steps.v.outputs.ver }}" '$0==v{f=1;next} /^## /{if(f)exit} f' CHANGELOG.md > notes.md
          printf '\n---\n**Downloads:** Windows: `GMC-Monitor-v%s.exe` · Linux: `GMC-Monitor-v%s-x86_64.AppImage` (precisa da WebKitGTK 4.1) ou `gmc-monitor-v%s-linux-x86_64.tar.gz` (com `install.sh`).\n' \
            "${{ steps.v.outputs.ver }}" "${{ steps.v.outputs.ver }}" "${{ steps.v.outputs.ver }}" >> notes.md
          cat notes.md
      - uses: softprops/action-gh-release@v2
        with:
          name: v${{ steps.v.outputs.ver }}
          tag_name: v${{ steps.v.outputs.ver }}
          target_commitish: ${{ github.sha }}
          body_path: notes.md
          files: |
            out/*.exe
            out/*.AppImage
            out/*.tar.gz
            out/SHA256SUMS.txt
