name: release

# Gera o .exe (Windows), o AppImage e o .tar.gz (Linux) e publica a release
# com o trecho daquela versão no CHANGELOG. Dispara sozinho:
#   - quando um push no main muda internal/app/version.go e a versão ainda
#     não tem release (cria a tag vX.Y.Z);
#   - Actions → release → Run workflow (a mesma coisa, à mão);
#   - empurrar uma tag "vX.Y.Z" (precisa bater com o version.go).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [internal/app/version.go]
    tags: ["v*"]

permissions:
  contents: write

# uma release por vez, na ordem dos pushes: duas seguidas (ex.: 2.20.5 e
# 2.21.0) corriam juntas e a mais velha terminava por último, virando a
# "latest" que o atualizador do app consulta
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      ver: ${{ steps.v.outputs.ver }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - name: Versão
        id: v
        run: |
          V=$(sed -n 's/^const AppVersion = "\(.*\)"/\1/p' internal/app/version.go)
          echo "ver=$V" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            if [ "v$V" != "${GITHUB_REF_NAME}" ]; then echo "a tag ${GITHUB_REF_NAME} não bate com internal/app/version.go ($V)"; exit 1; fi
          elif git ls-remote --exit-code --tags origin "refs/tags/v$V" >/dev/null; then
            echo "a versão $V já tem release (tag v$V): nada a publicar."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"

  build:
    needs: check
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Dependências do Linux (GTK/WebKit)
        # no pior caso (4 tentativas travadas) falha em ~25 min, não em horas
        timeout-minutes: 25
        run: |
          # o espelho do apt às vezes trava: tenta 4 vezes com tempo curto e,
          # a partir da 3ª, troca o espelho da Azure pelo oficial (o runner lista
          # o espelho em apt-mirrors.txt, não só no sources)
          for i in 1 2 3 4; do
            if [ "$i" -eq 3 ]; then
              sudo sed -i 's#http://azure.archive.ubuntu.com#http://archive.ubuntu.com#g' /etc/apt/apt-mirrors.txt /etc/apt/sources.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
            fi
            if [ "$i" -eq 4 ]; then
              # a porta 80 do Ubuntu também pode estar fora: espelho em https
              sudo sed -i 's#http://archive.ubuntu.com#https://mirrors.edge.kernel.org#g' /etc/apt/apt-mirrors.txt /etc/apt/sources.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
            fi
            sudo timeout 150 apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 update \
              && sudo timeout 300 apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 install -y libgtk-3-dev libwebkit2gtk-4.1-dev \
              && exit 0
            echo "apt: tentativa $i falhou"; sleep 10
          done
          exit 1
      - name: Versão
        id: v
        run: echo "ver=${{ needs.check.outputs.ver }}" >> "$GITHUB_OUTPUT"
      - name: Dependências travadas (go.sum)
        # o go.sum fica no repositório: confere as somas do que foi baixado e
        # falha se go.mod/go.sum precisarem de "go mod tidy"
        run: |
          go mod download
          go mod verify
          go mod tidy -diff
      - name: Testes
        run: go test -tags webkit2_41 ./...
      - name: Windows (.exe)
        run: |
          go install github.com/tc-hib/go-winres@v0.3.3
          go-winres make --in build/windows/winres.json
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -tags desktop,production \
            -ldflags "-w -s -H windowsgui" -o "out/RadLog-v${{ steps.v.outputs.ver }}.exe" .
      - name: Linux (AppImage e .tar.gz)
        run: |
          V=${{ steps.v.outputs.ver }}
          P="out/radlog-v$V-linux-x86_64"
          mkdir -p "$P"
          CGO_ENABLED=1 go build -trimpath -tags desktop,production,webkit2_41 -ldflags "-w -s" -o "$P/radlog" .
          cp build/linux/* "$P/"
          echo "$V" > "$P/VERSION"
          (cd "$P" && sh build-appimage.sh)
          mv "$P/RadLog-v$V-x86_64.AppImage" out/
          rm -rf "$P/RadLog.AppDir" "$P/appimagetool"
          tar -C out -czf "out/radlog-v$V-linux-x86_64.tar.gz" "radlog-v$V-linux-x86_64"
      - name: SHA-256 dos arquivos (o atualizador do app confere)
        run: |
          cd out
          sha256sum *.exe *.AppImage *.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Assinatura do SHA256SUMS.txt (o app 2.16+ só instala se conferir)
        env:
          RADLOG_SIGN_KEY: ${{ secrets.RADLOG_SIGN_KEY }}
        run: |
          # sem o segredo, ou com uma chave que não é a do app, o passo falha
          # e nada é publicado (os apps 2.16+ recusariam a versão)
          go run ./scripts/sign sign out/SHA256SUMS.txt
          go run ./scripts/sign verify out/SHA256SUMS.txt
      - name: Notas da versão (do CHANGELOG)
        run: |
          awk -v v="## ${{ steps.v.outputs.ver }}" '$0==v{f=1;next} /^## /{if(f)exit} f' CHANGELOG.md > notes.md
          printf '\n---\n**Downloads:** Windows: `RadLog-v%s.exe` · Linux: `RadLog-v%s-x86_64.AppImage` (precisa da WebKitGTK 4.1) ou `radlog-v%s-linux-x86_64.tar.gz` (com `install.sh`).\n' \
            "${{ steps.v.outputs.ver }}" "${{ steps.v.outputs.ver }}" "${{ steps.v.outputs.ver }}" >> notes.md
          cat notes.md
      - uses: softprops/action-gh-release@v2
        with:
          name: v${{ steps.v.outputs.ver }}
          tag_name: v${{ steps.v.outputs.ver }}
          target_commitish: ${{ github.sha }}
          body_path: notes.md
          make_latest: true
          files: |
            out/*.exe
            out/*.AppImage
            out/*.tar.gz
            out/SHA256SUMS.txt
            out/SHA256SUMS.txt.sig
